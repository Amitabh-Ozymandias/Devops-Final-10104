name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  # Pinned Trivy image (run as a container rather than via a third-party action)
  TRIVY_IMAGE: aquasec/trivy:0.58.1

jobs:
  # ---------------------------------------------------------------- tests
  backend-tests:
    name: Backend lint + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Run pytest
        # A non-zero exit code here fails the job and blocks every job that needs it
        run: pytest --cov=app --cov-report=term-missing

  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ------------------------------------------- build, scan and push images
  images:
    name: Build, scan & push (${{ matrix.service }})
    needs: [backend-tests, frontend-build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Compute image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image=${REGISTRY}/${owner}/spendwise-${{ matrix.service }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          load: true
          push: false
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

      - name: Trivy scan (fail on HIGH/CRITICAL)
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.cache/trivy:/root/.cache/trivy" \
            "$TRIVY_IMAGE" image \
              --severity HIGH,CRITICAL \
              --ignore-unfixed \
              --exit-code 1 \
              --format table \
              "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image (tagged with commit SHA)
        if: github.event_name != 'pull_request'
        run: docker push "${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}"

  # ------------------------------------------------------------- deploy
  deploy:
    name: Deploy to Kubernetes (kind)
    needs: images
    # Deploys the freshly pushed images to a throwaway kind cluster on the
    # runner: same Helm chart and Ingress as production, no cloud cost.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      KIND_VERSION: v0.30.0
      NAMESPACE: spendwise
    steps:
      - uses: actions/checkout@v4

      - uses: azure/setup-helm@v4
        with:
          version: v3.16.3

      - name: Install kind
        run: |
          curl -fsSLo kind "https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-amd64"
          sudo install -m 0755 kind /usr/local/bin/kind

      - name: Helm upgrade --install (cluster + ingress + app)
        env:
          SKIP_MONITORING: "1"
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          bash scripts/local-cluster.sh "$owner" "$GITHUB_SHA"

      - name: Verify rollout uses this commit's images
        run: |
          for d in spendwise-backend spendwise-frontend; do
            image="$(kubectl get deploy "$d" -n "$NAMESPACE" -o jsonpath='{.spec.template.spec.containers[0].image}')"
            echo "$d -> $image"
            [[ "$image" == *":${GITHUB_SHA}" ]]
            kubectl rollout status deploy/"$d" -n "$NAMESPACE" --timeout=120s
          done

      - name: Smoke test through the Ingress
        run: |
          for i in $(seq 1 30); do curl -sf http://localhost/api/expenses/summary && break; sleep 2; done
          echo
          curl -sf http://localhost/ | grep -q "<title>SpendWise</title>"
          payload='{"title":"CI smoke test","amount":1.5,"category":"Other","spent_on":"2026-01-01"}'
          curl -sf -X POST http://localhost/api/expenses -H 'Content-Type: application/json' -d "$payload"
          echo
          curl -sf http://localhost/api/expenses | grep -q "CI smoke test"
          echo "Frontend and API reachable through the Ingress"

      - name: Show deployment
        if: always()
        run: |
          kubectl get pods,svc,ingress -n "$NAMESPACE" -o wide
          helm list -n "$NAMESPACE"
