{{- $user := .Values.postgresql.auth.username -}}
{{- $password := include "spendwise.postgresPassword" . -}}
{{- $db := .Values.postgresql.auth.database -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "spendwise.secretName" . }}
  labels:
    {{- include "spendwise.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_DB: {{ $db | quote }}
  POSTGRES_USER: {{ $user | quote }}
  POSTGRES_PASSWORD: {{ $password | quote }}
  DATABASE_URL: {{ printf "postgresql+psycopg2://%s:%s@%s:5432/%s" $user ($password | urlquery) (include "spendwise.postgresHost" .) $db | quote }}
